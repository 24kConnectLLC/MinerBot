# MinerBot's web dashboard at bot.murderminershub.com, in front of the dashboard on its socket,
# /run/minerbot-dashboard/dashboard.sock.
# From deploy/minerbot-dashboard.conf in the MinerBot repository. setup-dashboard.sh installs it as
# /etc/nginx/conf.d/minerbot-dashboard.conf, only after it passes nginx -t on its own and then with every other site.
# cPanel never rewrites this file. Never add this host name in cPanel, and never add default_server or reuseport here:
# cPanel's default.conf has both on these ports, and nginx refuses to load when either is repeated.
# The certificate, its key, the proxy key and pipelog.conf are in /etc/nginx/minerbot/, which only root can read.
# It must work with the previous dashboard image too, which rollback.sh runs behind it, and the image of its own commit
# must work behind the previous file, since a deploy swaps the dashboard before setup installs this one. A change that
# can't, such as a new upstream, Host or proxy-key header, is split over pull requests: first an image that works both
# ways, then this file.

# Who asked for which path and how it went: no query string (Discord's callback carries ?code=...&state=...), no
# referer, no user agent, no cookies. In /var/log/nginx, so logrotate rotates it with the rest.
log_format minerbot_dashboard '$remote_addr [$time_iso8601] "$request_method $uri $server_protocol" $status '
                              '$body_bytes_sent $request_time $upstream_status $http_cf_ray';

# Port 80 only sends Cloudflare's visitors to https. Cloudflare uses it for http:// addresses unless the zone's
# Always Use HTTPS redirects them first.
server {
    listen 80;
    listen [::]:80;
    server_name bot.murderminershub.com;

    # cPanel's own list of Cloudflare's addresses, which cPanel keeps up to date. For a connection from one of them,
    # $remote_addr becomes the visitor's address from CF-Connecting-IP. For any other connection, or one from Cloudflare
    # without that header, it stays the connecting address, so the two are equal and the request is refused.
    # The [f] makes the include a pattern: if cPanel ever removes the file, nginx loads without it instead of failing
    # nginx -t for every site, and every request here is refused.
    include /etc/nginx/conf.d/includes-optional/cloudflare.con[f];
    if ($remote_addr = $realip_remote_addr) {
        return 403;
    }

    # cPanel's pipelog sends every request line, query strings included, to the domain logs. pipelog.conf turns it off
    # here: it holds "pipelog off;" while cPanel loads its pipelog module, that is while WHM's piped logging is on, and
    # nothing while it's off, when nginx would refuse the directive. setup-dashboard.sh writes it, and cPanel runs
    # /etc/nginx/ea-nginx/config-scripts/global/minerbot-pipelog to write it again each time it rebuilds nginx's files.
    include /etc/nginx/minerbot/pipelog.con[f];
    access_log /var/log/nginx/minerbot-dashboard.access.log minerbot_dashboard;

    return 301 https://bot.murderminershub.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 off;
    # The dashboard's pages hold secrets next to text visitors control, so nothing compresses them: not nginx,
    # whatever cPanel's http level says, and not Cloudflare, which the dashboard's Cache-Control: no-transform asks not to
    gzip off;
    # cPanel's http-level add_header lines, if there are any, never reach these responses: the dashboard sends its own
    add_header_inherit off;
    server_name bot.murderminershub.com;

    # A Cloudflare Origin certificate for this one name. Cloudflare checks it (SSL Strict); browsers never see it.
    ssl_certificate /etc/nginx/minerbot/origin-cert.pem;
    ssl_certificate_key /etc/nginx/minerbot/origin-key.pem;

    include /etc/nginx/conf.d/includes-optional/cloudflare.con[f];
    if ($remote_addr = $realip_remote_addr) {
        return 403;
    }

    include /etc/nginx/minerbot/pipelog.con[f];
    access_log /var/log/nginx/minerbot-dashboard.access.log minerbot_dashboard;
    error_log /var/log/nginx/minerbot-dashboard.error.log warn;

    # Four times the dashboard's own 64 KB, so the dashboard answers anything in between with its own page, and kept in
    # memory, so a request body is never written to nginx's temporary files
    client_max_body_size 256k;
    client_body_buffer_size 256k;

    # Set here, so both locations below inherit exactly these and nothing from cPanel's http level. Each replaces any
    # header of the same name the visitor sent; CF-Connecting-IP and Cloudflare Access's Cf-Access-Jwt-Assertion pass.
    proxy_http_version 1.1;
    proxy_set_header Host bot.murderminershub.com;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header X-Forwarded-Port "";
    proxy_set_header X-Forwarded-Prefix "";
    proxy_set_header Forwarded "";
    proxy_set_header X-Real-IP "";
    # One line, written by setup-dashboard.sh: proxy_set_header X-MinerBot-Proxy-Key "<64 hex>";
    # A pattern too: without the file the dashboard answers 404 to everything, and nginx -t still passes for the others.
    include /etc/nginx/minerbot/proxy-key.con[f];

    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    # A sign-in makes up to three Discord calls of 10 seconds each, then writes to the database
    proxy_read_timeout 60s;
    # The redirect to Discord carries a long state beside the cookies and the security headers
    proxy_buffer_size 16k;
    proxy_buffers 8 16k;
    proxy_busy_buffers_size 32k;
    # Pages are never cached or written to nginx's temporary files
    proxy_max_temp_file_size 0;
    proxy_cache off;

    # nginx's own 502 and 504, when the dashboard is stopped, starting or too slow: its socket missing, or there with
    # nothing listening. Its own answers pass as they are.
    error_page 502 504 = @dashboard_down;

    # The dashboard listens only on a Unix socket in a folder that only its own user can write, and nginx's workers can
    # enter. No other account on this server can take the socket's place, as one could take a free TCP port while the
    # dashboard restarts, and so be handed visitors' requests, their cookies and the proxy key.
    location / {
        proxy_pass http://unix:/run/minerbot-dashboard/dashboard.sock;
    }

    # Discord's callback carries the sign-in's code and state in its query string, and nginx's error log quotes the
    # whole request line when the dashboard is down or slow, so this address logs only emergencies: nginx logs a
    # missing socket, or one it can't open, as critical, and a failure such as running out of open files as an alert.
    # The access log's status and upstream status still show what happened.
    location ~* ^/signin-discord$ {
        proxy_pass http://unix:/run/minerbot-dashboard/dashboard.sock;
        error_log /var/log/nginx/minerbot-dashboard.error.log emerg;
    }

    location @dashboard_down {
        default_type "text/plain; charset=utf-8";
        add_header Cache-Control "no-store" always;
        add_header Retry-After "30" always;
        return 503 "The MinerBot dashboard is restarting or stopped. Try again in a minute.\n";
    }
}
