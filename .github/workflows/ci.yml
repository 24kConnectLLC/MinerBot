name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    # The deploy tests' step limits added up, with room for the build and the .NET tests, so a slow step fails with its
    # own message
    timeout-minutes: 125

    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build "MinerBot 2.0.sln"

      - name: Test
        # The database tests start MariaDB in Docker, which this runner has, so here they fail instead of skipping
        env:
          MINERBOT_DB_TESTS: required
        run: dotnet test --solution "MinerBot 2.0.sln" --no-build

      # Steam's map times carry no zone and are read as UTC. This runner is on UTC, where reading them in the machine's
      # zone gives the same answer, so the map embeds are tested again in another zone. The date check fails the step if
      # the zone didn't take.
      - name: Test the map times in another zone
        env:
          TZ: America/New_York
        run: |
          test "$(date +%z)" != "+0000"
          dotnet test --project MinerBot.Tests --no-build --filter-class "*.MapEmbedTests"

      - name: Check the deploy scripts
        run: shellcheck -x -P SCRIPTDIR deploy/*.sh deploy/tests/*.sh deploy/tests/fakes/*

      - name: Check the compose file
        run: |
          touch deploy/bot.env
          docker compose -f deploy/compose.yml config --quiet

      # Each step's limit is above its script's own: up to 5 minutes for the image pull, then the containers' lifetimes
      # (10 minutes for nginx-test.sh, 7 for nginx-procedure-test.sh, 270 seconds for rights-test.sh's checks, and 20
      # minutes for scripts-test.sh's cases), and for image-files-test.sh two builds of 15 minutes each
      - name: Check the nginx file in nginx's own image
        timeout-minutes: 15
        run: bash deploy/tests/nginx-test.sh

      - name: Check the nginx procedure with a real nginx
        timeout-minutes: 13
        run: bash deploy/tests/nginx-procedure-test.sh

      - name: Check the database rights procedure against MariaDB 11.4
        timeout-minutes: 10
        run: bash deploy/tests/rights-test.sh

      - name: Check the scripts' logic with stand-in commands
        timeout-minutes: 30
        run: bash deploy/tests/scripts-test.sh

      - name: Check that each image's user can read its files and change none
        timeout-minutes: 35
        run: bash deploy/tests/image-files-test.sh
